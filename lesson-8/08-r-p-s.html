<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rock, Paper, Scissor</title>
</head>
<body>
    <h1>Rock Paper Scissor</h1>

    <button onclick="
        playGame('Rock');
    ">Rock</button>

    <button onclick="
        playGame('Paper');
    ">Paper</button>

    <button onclick="
        playGame('Scissor');
    ">Scissor</button>

    <button onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        console.log ('score reset');
    ">Reset Score</button>

    <button onclick="
        console.log(score);
    ">Show Score</button>

    <script>
        //default operator
        const score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties: 0,
        };
        /*
        if(!score){
            score = {
                wins: 0,
                losses: 0,
                ties: 0,
            };
        }*/


        function playGame(playerMove){
            const move = pickComputerMove();

            let result = '';

            if (playerMove === 'Scissor'){
                if (move === 'Rock'){
                    result = 'You Lose.';
                }else if (move === 'Paper'){
                    result = 'You Win.';
                }else if (move === 'Scissor'){
                    result = 'Tie.';
                }
            } else if (playerMove === 'Paper'){
                if (move === 'Rock'){
                    result = 'You Win.';
                }else if (move === 'Paper'){
                    result = 'Tie.';
                }else if (move === 'Scissor'){
                    result = 'You Lose.';
                }
            } else if (playerMove === 'Rock'){
                if (move === 'Rock'){
                    result = 'Tie.';
                }else if (move === 'Paper'){
                    result = 'You Lose.';
                }else if (move === 'Scissor'){
                    result = 'You Win.';
                }
            }

            if(result === 'You Win.'){
                score.wins += 1;
            }else if (result === 'You Lose.'){
                score.losses += 1;
            }else if (result === 'Tie.'){
                score.ties += 1;
            }

            localStorage.setItem('score', JSON.stringify(score));

            alert(`You picked ${playerMove}. Computer picked ${move}. ${result}
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
        }

        function pickComputerMove(){
            const randomNumber =  Math.random();

            let move = ' ';

            if(randomNumber >= 0 && randomNumber < 1/3){
                move = 'Rock';
            }else if (randomNumber >= 1/3 && randomNumber < 2/3){
                move = 'Paper';
            }else{
                move = 'Scissor';
            }

            return move;
        }
    </script> 
</body>
</html>

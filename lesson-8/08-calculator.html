<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculator</title>
    <style>
        body{
            background: black ;
        }
        h1{
            color: white;
        }
        button{
            font-size: 25px;
            font-weight: bold;
            color: white;
            background-color: rgb(77, 77, 77);
            height: 80px;
            width: 80px;
            border-radius: 50px;
            border: none;
        }
        .operator{
            background-color: orange;
        }
    </style>
</head>
<body>

    <h1>Basic Calculator</h1>
    <p>
        <button onclick="
            updateCalculation('1');
        ">1</button>

        <button onclick="
            updateCalculation('2');
        ">2</button>

        <button onclick="
            updateCalculation('3');
        ">3</button>

        <button class="operator" onclick="
            updateCalculation('+');
        ">+</button>
    </p>

    <p>
        <button onclick="
            updateCalculation('4');
        ">4</button>

        <button onclick="
            updateCalculation('5');
        ">5</button>

        <button onclick="
            updateCalculation('6');
        ">6</button>

        <button class="operator" onclick="
            updateCalculation('-');
        ">-</button>
    </p>

    <p>
        <button onclick="
            updateCalculation('7');
        ">7</button>

        <button onclick="
            updateCalculation('8');
        ">8</button>

        <button onclick="
            updateCalculation('9');
        ">9</button>

        <button class="operator" onclick="
            updateCalculation('*');
        ">*</button>
    </p>

    <p>
        <button onclick="
           updateCalculation('0');
        ">0</button>

        <button onclick="
            updateCalculation('.');
        ">.</button>

        <button onclick="
            calculation = eval(calculation);
            console.log(calculation);
            saveCalculation();
        ">=</button>

        <button class="operator" onclick="
            updateCalculation('/');
        ">/</button>
    </p>
    
    <button onclick="
        calculation = '';
        console.log(calculation);
        saveCalculation();
    ">Clear</button>

    <script>
        let calculation = localStorage.getItem('calculation') || '';
        
        function updateCalculation(value){
            calculation += value;
            console.log(calculation);
            saveCalculation();
        }

        function saveCalculation(){
            localStorage.setItem('calculation', calculation);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cart</title>
</head>
<body>
    <h4>Cart Quantity</h4>

    <button class="show" onclick="
        console.log('Cart Quantity: ' + cartQuantity);
    ">Show Quantity</button>
    
    <button onclick="
        updateCartQuantity(1);
    ">Add to cart</button>

    <button onclick=" 
        updateCartQuantity(2);
    ">+2</button>

    <button onclick="
        updateCartQuantity(3);
    ">+3</button>

    <button onclick="
        updateCartQuantity(4);
    ">+4</button>

    <button onclick="
        updateCartQuantity(5);
    ">+5</button>

    <button onclick="
        updateCartQuantity(-1);
    ">Remove from cart</button>

    <button onclick="
        updateCartQuantity(-2);
    ">-2</button>

    <button onclick="
        updateCartQuantity(-3);
    ">-3</button>

    <button onclick="
        cartQuantity = 0;
        console.log('Cart was reset');
        console.log('Cart Quantity: ' + cartQuantity);
    ">Reset Cart</button>

    <script>
        let cartQuantity = 0;
        function updateCartQuantity(value){
            cartQuantity += value;
            console.log('Cart Quantity: ' + cartQuantity);

            if(cartQuantity >= 10){
                alert('The cart is Full');
                return;
            }else if (cartQuantity <0){
                alert('Not enough items in the cart');
                return;
            }
        }
    </script>
</body>
</html>

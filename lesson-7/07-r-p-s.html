<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rock, Paper, Scissor</title>
</head>
<body>
    <h1>Rock Paper Scissor</h1>

    <button onclick="
        playGame('Rock');
    ">Rock</button>

    <button onclick="
        playGame('Paper');
    ">Paper</button>

    <button onclick="
        playGame('Scissor');
    ">Scissor</button>

    <script>
        function playGame(playerMove){
            const move = pickComputerMove();

            let result = '';

            if (playerMove === 'Scissor'){
                if (move === 'Rock'){
                    result = 'You Lose. ';
                }else if (move === 'Paper'){
                    result = 'You Win.';
                }else if (move === 'Scissor'){
                    result = 'Tie.';
                }
            } else if (playerMove === 'Paper'){
                if (move === 'Rock'){
                    result = 'You Win. ';
                }else if (move === 'Paper'){
                    result = 'Tie.';
                }else if (move === 'Scissor'){
                    result = 'You Lose.';
                }
            } else if (playerMove === 'Rock'){
                if (move === 'Rock'){
                    result = 'Tie. ';
                }else if (move === 'Paper'){
                    result = 'You Lose.';
                }else if (move === 'Scissor'){
                    result = 'You Win.';
                }
            }

            alert(`You picked ${playerMove}. Computer picked ${move}. ${result}`);
        }

        function pickComputerMove(){
            const randomNumber =  Math.random();

            let move = ' ';

            if(randomNumber >= 0 && randomNumber < 1/3){
                move = 'Rock';
            }else if (randomNumber >= 1/3 && randomNumber < 2/3){
                move = 'Paper';
            }else{
                move = 'Scissor';
            }

            return move;
        }
    </script> 
</body>
</html>
